[project]
name = "mongotar"
version = "0.1.1"
description = "Serialize directory structures with basic permissions into human-readable text files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = ["pathspec>=0.11"]
authors = [{ name = "Sebastian Carlos" }]

[project.urls]
Repository = "https://github.com/sebastiancarlos/mongotar"

[project.optional-dependencies]
dev = ["ruff", "pyright", "coverage"]

[project.scripts]
mongotar = "mongotar.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mongotar"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "N", "RUF100"]

[tool.pyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.14"
typeCheckingMode = "basic"

[tool.coverage.run]
branch = true
source = ["src/mongotar"]
parallel = true
patch = ["subprocess"]
relative_files = true

[tool.coverage.report]
show_missing = true
fail_under = 90
